; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Only build/upload the main env by default. Test env is used exclusively by pio test.
default_envs = nanoatmega328-old

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
debug_tool = avr-stub
debug_port = COM3 ; Change this to the correct COM port for your Nano
lib_deps =
    jdolinay/avr-debugger @ ~1.4

[env:nanoatmega328-old]
platform = atmelavr
board = nanoatmega328
board_bootloader.speed = 57600
framework = arduino
upload_speed = 57600
debug_tool = avr-stub
debug_port = COM3
lib_deps =
    jdolinay/avr-debugger @ ~1.4


[env:nanoatmega328-old-test]
platform = atmelavr
board = nanoatmega328
board_bootloader.speed = 57600
framework = arduino
upload_speed = 57600
debug_tool = avr-stub
debug_port = COM3
lib_deps =
    jdolinay/avr-debugger @ ~1.4
test_build_src = true
build_src_filter =
    +<*>
    -<main.cpp>